name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: install frontend dependencies
        run: npm ci

      - name: Read release notes
        id: release_notes
        shell: bash
        run: |
          if [ -f "docs/release_notes_${{ github.ref_name }}.md" ]; then
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "body<<$EOF" >> "$GITHUB_OUTPUT"
            cat "docs/release_notes_${{ github.ref_name }}.md" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body=Новая версия Vispeak доступна для установки. Подробности см. на странице релиза GitHub." >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ 
          releaseName: 'v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

  build-linux:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  publish-release:
    needs: [publish-tauri, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vispeak-linux-*
          path: linux-artifacts
      - name: Prepare distribution-specific assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          for distro in ubuntu debian fedora; do
            find "linux-artifacts/vispeak-linux-$distro" -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
              while IFS= read -r -d '' package; do
                cp "$package" "release-assets/${RELEASE_TAG}-${distro}-$(basename "$package")"
                cp "$package.sig" "release-assets/${RELEASE_TAG}-${distro}-$(basename "$package").sig"
              done
          done
          install -Dm755 linux-artifacts/vispeak-linux-arch/vispeak arch-package/usr/bin/vispeak
          install -Dm644 packaging/arch/vispeak.desktop arch-package/usr/share/applications/app.vispeak.desktop
          install -Dm644 src-tauri/icons/128x128.png arch-package/usr/share/icons/hicolor/128x128/apps/vispeak.png
          install -Dm644 LICENSE arch-package/usr/share/licenses/vispeak/LICENSE
          cp packaging/arch/PKGBUILD "release-assets/${RELEASE_TAG}-arch-PKGBUILD"
          tar -czf "release-assets/${RELEASE_TAG}-arch-x86_64.tar.gz" -C arch-package .
      - name: Verify Windows updater manifest before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --pattern '*.exe.sig' --dir updater-check
          python3 - <<'PYVERIFY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path("updater-check/latest.json").read_text())
          assert manifest["version"].lstrip("v") == os.environ["RELEASE_TAG"].lstrip("v")
          platforms = manifest["platforms"]
          windows = [value for key, value in platforms.items() if key in ("windows-x86_64", "windows-x86_64-nsis")]
          assert windows, "Missing Windows x64 updater"
          for platform in windows:
              url = platform["url"]
              assert url.startswith("https://github.com/V2P-Dev/Vispeak/releases/download/" + os.environ["RELEASE_TAG"] + "/")
              assert url.endswith("-setup.exe"), "Updater must use NSIS"
              signature = Path("updater-check", url.rsplit("/", 1)[-1] + ".sig").read_text().strip()
              assert signature and platform["signature"].strip() == signature
          print("Windows NSIS updater manifest validated")
          PYVERIFY
      - name: Merge Linux updates and verify all signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/prepare-release-updater.py "$RELEASE_TAG" updater-check/latest.json release-assets
          gh release download "$RELEASE_TAG" --pattern '*-setup.exe' --dir updater-check
          sudo apt-get update -qq
          sudo apt-get install -y minisign
          python3 - <<'PYPUBKEY'
          import base64, json
          from pathlib import Path
          config = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          Path('updater-check/updater.pub').write_bytes(base64.b64decode(config['plugins']['updater']['pubkey']))
          PYPUBKEY
          for signature in updater-check/*.exe.sig release-assets/*.deb.sig release-assets/*.rpm.sig; do
            decoded="updater-check/$(basename "$signature").minisig"
            base64 --decode "$signature" > "$decoded"
            minisign -Vm "${signature%.sig}" -x "$decoded" -p updater-check/updater.pub
          done
          gh release upload "$RELEASE_TAG" updater-check/latest.json --clobber
      - name: Upload Linux assets and publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
